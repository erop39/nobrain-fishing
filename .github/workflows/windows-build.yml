name: Nobrain Companion Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'remote_fishing.py'
      - 'NobrainCompanion.spec'
      - 'requirements*.txt'
      - 'assets/**'
      - 'samples/**'
      - 'bite_sample.wav'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt -r requirements-optional.txt
      - name: Build GUI EXE (no console)
        run: pyinstaller --noconfirm --clean NobrainCompanion.spec
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path dist/NobrainCompanion -DestinationPath NobrainCompanion-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NobrainCompanion-Windows
          path: NobrainCompanion-Windows.zip
          retention-days: 30
